<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--surface); }
    .auth-page { background: var(--surface); }
    .back-link {
      position: fixed; top: 1.25rem; left: 1.5rem;
      font-size: 0.85rem; color: var(--ink3);
      display: flex; align-items: center; gap: 5px;
      transition: color .15s;
    }
    .back-link:hover { color: var(--ink); }
    .form-row { display: flex; flex-direction: column; gap: 14px; }
    .password-wrap { position: relative; }
    .password-wrap .form-input { padding-right: 3rem; }
    .toggle-pw {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--ink3); font-size: 0.8rem; padding: 4px 6px;
    }
    .toggle-pw:hover { color: var(--ink); }
    .strength-bar {
      height: 4px; border-radius: 2px; background: var(--border);
      margin-top: 6px; overflow: hidden;
    }
    .strength-fill { height: 100%; border-radius: 2px; width: 0; transition: width .3s, background .3s; }
    .strength-label { font-size: 0.75rem; color: var(--ink3); margin-top: 3px; }
    .google-btn {
      width: 100%; padding: 0.7rem;
      background: #fff; border: 1px solid var(--border);
      border-radius: var(--r); font-size: 0.9rem; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; transition: background .15s;
    }
    .google-btn:hover { background: var(--surface); }
    .error-msg {
      background: var(--danger-lt); color: var(--danger);
      border-radius: var(--r); padding: 0.6rem 0.9rem;
      font-size: 0.85rem; display: none;
    }
    .error-msg.show { display: block; }
    .terms-note { font-size: 0.75rem; color: var(--ink3); text-align: center; line-height: 1.5; }
    .terms-note a { color: var(--accent2); }
    .plan-pill {
      background: var(--accent-lt); border: 1px solid #b8e0c8;
      border-radius: var(--r); padding: 0.75rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.25rem;
    }
    .plan-pill-info { font-size: 0.85rem; }
    .plan-pill-info strong { font-weight: 600; color: var(--accent); }
    .plan-pill-change { font-size: 0.78rem; color: var(--accent2); cursor: pointer; }
    .plan-pill-change:hover { text-decoration: underline; }
  </style>
</head>
<body>

<a href="index.html" class="back-link">← Back to home</a>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Task<span>Flow</span></div>
    <p class="auth-subtitle">Create your free account — no card needed</p>

    <!-- Selected plan indicator -->
    <div class="plan-pill">
      <div class="plan-pill-info">Starting on <strong>Free plan</strong> — upgrade anytime</div>
      <span class="plan-pill-change" onclick="window.location.href='index.html#pricing'">Change →</span>
    </div>

    <!-- Google (disabled until Supabase) -->
    <button class="google-btn" onclick="alert('Google signup coming soon! Use email for now.')">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l6-6C34.5 6.4 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l7 5.1C15.1 16.1 19.2 13 24 13c3 0 5.7 1.1 7.8 2.9l6-6C34.5 6.4 29.5 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.3C29.4 35.5 26.8 36 24 36c-5.2 0-9.7-3.3-11.3-8l-6.9 5.3C9.4 39.3 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.2 5.3c3.6-3.3 5.8-8.2 5.8-14-.1-1.3-.2-2.7-.4-5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or sign up with email</div>

    <div id="errorMsg" class="error-msg"></div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input class="form-input" type="text" id="name" placeholder="Juan dela Cruz" autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-wrap">
          <input class="form-input" type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
          <button class="toggle-pw" id="togglePw" type="button">Show</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <button class="btn btn-green btn-full" id="signupBtn">Create free account →</button>
    </div>

    <div class="terms-note">
      By signing up you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  Auth.requireGuest();

  const nameEl      = document.getElementById('name');
  const emailEl     = document.getElementById('email');
  const passwordEl  = document.getElementById('password');
  const signupBtn   = document.getElementById('signupBtn');
  const errorMsg    = document.getElementById('errorMsg');
  const togglePw    = document.getElementById('togglePw');
  const strengthFill  = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');

  togglePw.addEventListener('click', () => {
    const isText = passwordEl.type === 'text';
    passwordEl.type = isText ? 'password' : 'text';
    togglePw.textContent = isText ? 'Show' : 'Hide';
  });

  function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('show'); }
  function hideError()    { errorMsg.classList.remove('show'); }

  // Password strength meter
  passwordEl.addEventListener('input', () => {
    const pw = passwordEl.value;
    let score = 0;
    if (pw.length >= 8)  score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    const configs = [
      { w: '0%',   bg: '',                    txt: '' },
      { w: '25%',  bg: 'var(--danger)',        txt: 'Weak' },
      { w: '50%',  bg: '#f0a500',             txt: 'Fair' },
      { w: '75%',  bg: 'var(--accent2)',       txt: 'Good' },
      { w: '100%', bg: 'var(--accent)',        txt: 'Strong' },
    ];
    const cfg = configs[Math.min(score, 4)];
    strengthFill.style.width      = pw.length ? cfg.w  : '0%';
    strengthFill.style.background = cfg.bg;
    strengthLabel.textContent     = pw.length ? cfg.txt : '';
  });

  signupBtn.addEventListener('click', () => {
    hideError();
    const name     = nameEl.value.trim();
    const email    = emailEl.value.trim();
    const password = passwordEl.value;

    if (!name || !email || !password) { showError('Please fill in all fields.'); return; }
    if (!email.includes('@'))          { showError('Enter a valid email address.'); return; }
    if (password.length < 8)           { showError('Password must be at least 8 characters.'); return; }

    signupBtn.textContent = 'Creating account…';
    signupBtn.disabled = true;

    setTimeout(() => {
      const result = Auth.signup(name, email, password);
      if (result.error) {
        showError(result.error);
        signupBtn.textContent = 'Create free account →';
        signupBtn.disabled = false;
      } else {
        window.location.href = 'app.html';
      }
    }, 700);
  });

  [nameEl, emailEl, passwordEl].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') signupBtn.click(); })
  );
</script>
</body>
</html>
