<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--surface); }
    .auth-page { background: var(--surface); }
    .back-link {
      position: fixed; top: 1.25rem; left: 1.5rem;
      font-size: 0.85rem; color: var(--ink3);
      display: flex; align-items: center; gap: 5px;
      transition: color .15s;
    }
    .back-link:hover { color: var(--ink); }
    .form-row { display: flex; flex-direction: column; gap: 14px; }
    .password-wrap { position: relative; }
    .password-wrap .form-input { padding-right: 3rem; }
    .toggle-pw {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--ink3); font-size: 0.8rem; padding: 4px 6px;
    }
    .toggle-pw:hover { color: var(--ink); }
    .forgot { font-size: 0.8rem; color: var(--accent2); float: right; margin-top: -8px; }
    .forgot:hover { text-decoration: underline; }
    .google-btn {
      width: 100%; padding: 0.7rem;
      background: #fff; border: 1px solid var(--border);
      border-radius: var(--r); font-size: 0.9rem; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; transition: background .15s;
    }
    .google-btn:hover { background: var(--surface); }
    .google-btn img { width: 18px; height: 18px; }
    .error-msg {
      background: var(--danger-lt); color: var(--danger);
      border-radius: var(--r); padding: 0.6rem 0.9rem;
      font-size: 0.85rem; display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

<a href="index.html" class="back-link">← Back to home</a>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Task<span>Flow</span></div>
    <p class="auth-subtitle">Welcome back — sign in to your account</p>

    <!-- Google (disabled until Supabase is set up) -->
    <button class="google-btn" onclick="alert('Google login coming soon! Use email for now.')">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l6-6C34.5 6.4 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l7 5.1C15.1 16.1 19.2 13 24 13c3 0 5.7 1.1 7.8 2.9l6-6C34.5 6.4 29.5 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.3C29.4 35.5 26.8 36 24 36c-5.2 0-9.7-3.3-11.3-8l-6.9 5.3C9.4 39.3 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.2 5.3c3.6-3.3 5.8-8.2 5.8-14-.1-1.3-.2-2.7-.4-5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <div id="errorMsg" class="error-msg">Invalid email or password.</div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <a href="#" class="forgot">Forgot password?</a>
        <div class="password-wrap">
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button class="toggle-pw" id="togglePw" type="button">Show</button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" id="loginBtn">Sign in</button>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one free</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  Auth.requireGuest();

  const emailEl    = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const loginBtn   = document.getElementById('loginBtn');
  const errorMsg   = document.getElementById('errorMsg');
  const togglePw   = document.getElementById('togglePw');

  togglePw.addEventListener('click', () => {
    const isText = passwordEl.type === 'text';
    passwordEl.type = isText ? 'password' : 'text';
    togglePw.textContent = isText ? 'Show' : 'Hide';
  });

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }
  function hideError() { errorMsg.classList.remove('show'); }

  loginBtn.addEventListener('click', () => {
    hideError();
    const email    = emailEl.value.trim();
    const password = passwordEl.value;

    if (!email || !password) { showError('Please fill in all fields.'); return; }
    if (!email.includes('@')) { showError('Enter a valid email address.'); return; }

    loginBtn.textContent = 'Signing in…';
    loginBtn.disabled = true;

    // Simulate network delay (remove when Supabase is ready)
    setTimeout(() => {
      const result = Auth.login(email, password);
      if (result.error) {
        showError(result.error);
        loginBtn.textContent = 'Sign in';
        loginBtn.disabled = false;
      } else {
        window.location.href = 'app.html';
      }
    }, 600);
  });

  // Allow Enter key to submit
  [emailEl, passwordEl].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); })
  );
</script>
</body>
</html>
